[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animasound"
version = "0.1.0"
description = "A modern desktop application for audio analysis and manipulation using librosa"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "AnimaSound Team", email = "dev@animasound.app"}
]
dependencies = [
    "PySide6>=6.6.0",
    "librosa>=0.10.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "soundfile>=0.12.1",
    "audioread>=3.0.0",
    "qtawesome>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.3.0",
    "pytest>=7.4.0",
]

[project.scripts]
animasound = "anima.main:main"

[project.gui-scripts]
animasound-gui = "anima.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
